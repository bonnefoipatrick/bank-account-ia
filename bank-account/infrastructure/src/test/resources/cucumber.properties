# Configuration Cucumber

# Format de sortie
cucumber.publish.quiet=true

# Plugins
cucumber.plugin=pretty, html:target/cucumber-reports/cucumber.html, json:target/cucumber-reports/cucumber.json, junit:target/cucumber-reports/cucumber.xml

# Tags
cucumber.tags=@bank-account

# Features
cucumber.features=classpath:features/bank_account

# Glue (step definitions)
cucumber.glue=com.bankaccount.infrastructure.steps

# Dry run (vérifier les étapes sans exécuter)
cucumber.dry-run=false

# Strict mode (échouer sur les étapes non définies)
cucumber.strict=true

# Monochrome (sortie plus lisible)
cucumber.monochrome=true

# Nom du projet
cucumber.name=Bank Account IA - BDD Tests
