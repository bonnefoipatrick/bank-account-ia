server:
  port: 8080

spring:
  application:
    name: bank-account-service

  # Configuration de la base de données H2 (en mémoire)
  datasource:
    url: jdbc:h2:mem:bankdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Configuration Kafka (par défaut, utilise un broker local)
kafka:
  bootstrap-servers: localhost:9092
  
  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    acks: all
    retries: 3

  consumer:
    group-id: bank-account-group
    auto-offset-reset: earliest
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    properties:
      spring.json.trusted.packages: "com.bankaccount.application.command,com.bankaccount.application.event"

# Logging
logging:
  level:
    org.springframework: INFO
    com.bankaccount: DEBUG
