apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ressources de base
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - configmap.yaml

# Namespace (sera écrasé par les overlays)
namespace: bank-account

# Labels communs
commonLabels:
  app: bank-account
  managed-by: kustomize

# ConfigMap Generator (optionnel)
# configMapGenerator:
