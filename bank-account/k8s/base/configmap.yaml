apiVersion: v1
kind: ConfigMap
metadata:
  name: bank-account-config
  labels:
    app: bank-account
    tier: backend
    component: config
data:
  # Configuration Spring Boot
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"
  
  # Configuration de la base de données
  SPRING_DATASOURCE_URL: "jdbc:h2:mem:bankdb"
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.h2.Driver"
  SPRING_DATASOURCE_USERNAME: "sa"
  SPRING_DATASOURCE_PASSWORD: ""
  
  # Configuration JPA/Hibernate
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_JPA_SHOW_SQL: "false"
  SPRING_JPA_FORMAT_SQL: "true"
  
  # Configuration H2 Console
  SPRING_H2_CONSOLE_ENABLED: "false"
  SPRING_H2_CONSOLE_PATH: "/h2-console"
  
  # Configuration Kafka
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_PRODUCER_KEY_SERIALIZER: "org.apache.kafka.common.serialization.StringSerializer"
  KAFKA_PRODUCER_VALUE_SERIALIZER: "org.springframework.kafka.support.serializer.JsonSerializer"
  KAFKA_CONSUMER_KEY_DESERIALIZER: "org.apache.kafka.common.serialization.StringDeserializer"
  KAFKA_CONSUMER_VALUE_DESERIALIZER: "org.springframework.kafka.support.serializer.JsonDeserializer"
  KAFKA_CONSUMER_GROUP_ID: "bank-account-group"
  KAFKA_CONSUMER_AUTO_OFFSET_RESET: "earliest"
  KAFKA_TRUSTED_PACKAGES: "com.bankaccount.application.command,com.bankaccount.application.event"
  
  # Configuration Logging
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: "INFO"
  LOGGING_LEVEL_COM_BANKACCOUNT: "INFO"
