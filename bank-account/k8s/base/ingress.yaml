apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bank-account-ingress
  labels:
    app: bank-account
    tier: backend
    component: ingress
  annotations:
    # Annotations pour NGINX Ingress Controller
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    
    # Annotations pour cert-manager (si HTTPS est activé)
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # cert-manager.io/acme-challenge-type: "http01"
    
    # Annotations pour ArgoCD
    argocd.argoproj.io/sync-options: Prune=true
    argocd.argoproj.io/sync-wave: "0"

spec:
  ingressClassName: nginx
  rules:
  - host: bank-account.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bank-account-service
            port:
              number: 8080
  # TLS configuration (désactivée par défaut)
  # tls:
  # - hosts:
  #   - bank-account.local
  #   secretName: bank-account-tls
