apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bank-account-dev
  namespace: argocd
  labels:
    app: bank-account
    environment: dev
    team: backend
  annotations:
    argocd.argoproj.io/sync-options: Prune=true
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded

spec:
  # Projet ArgoCD
  project: default
  
  # Source du code
  source:
    repoURL: https://github.com/bonnefoipatrick/bank-account-ia.git
    targetRevision: main
    path: bank-account/k8s/overlays/dev
    
    # Configuration Kustomize
    plugin:
      name: kustomize
      env:
        - name: KUSTOMIZE_PLUGIN_HOME
          value: /tmp/kustomize
  
  # Destination
  destination:
    server: https://kubernetes.default.svc
    namespace: bank-account-dev
    
  # Stratégie de synchronisation
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - Prune=true
      - ApplyOutOfSyncOnly=true
    
    # Synchronisation automatique toutes les 5 minutes
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Ignorer les différences (optionnel)
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: networking.k8s.io
      kind: Ingress
      jsonPointers:
        - /spec/rules/0/host

  # Notifications (optionnel)
  # info:
  #   - name: slack-notifications
  #     value: "bank-account-dev"
