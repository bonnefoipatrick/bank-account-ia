server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Routing Angular (application single page)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers le backend Spring Boot (bank-account-service, port 8080)
    location /api/ {
        proxy_pass http://bank-account-service:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        access_log off;
    }
}
